<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSec Lab Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Courier New', Courier, monospace; }
        .navbar { background-color: #1f1f1f; border-bottom: 2px solid #00ff00; }
        .card { background-color: #1f1f1f; border: 1px solid #333; color: #fff; }
        .text-neon { color: #00ff00; text-shadow: 0 0 5px #00ff00; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand text-neon fw-bold" href="{{ url_for('index') }}">⚡ CyberSec Lab Tracker</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="{{ url_for('index') }}">Dashboard</a>
                <a class="nav-link text-white" href="{{ url_for('add_lab') }}">Log New Lab</a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
