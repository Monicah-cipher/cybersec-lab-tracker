{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4 shadow-sm">
            <h4 class="text-neon mb-4">🛠️ Modify Operation: {{ lab.title }}</h4>
            
            <form action="{{ url_for('edit_lab', id=lab.id) }}" method="POST" enctype="multipart/form-data">
                
                <div class="mb-3">
                    <label for="title" class="form-label text-white fw-bold">Operation / Lab Name</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" id="title" name="title" value="{{ lab.title }}" required>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="platform" class="form-label text-white fw-bold">Platform</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" id="platform" name="platform" value="{{ lab.platform }}" required>
                    </div>
                    <div class="col-md-6">
                        <label for="category" class="form-label text-white fw-bold">Category</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" id="category" name="category" value="{{ lab.category if lab.category else '' }}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="status" class="form-label text-white fw-bold">Status</label>
                    <select class="form-select bg-dark text-white border-secondary" id="status" name="status">
                        <option value="In Progress" {% if lab.status == 'In Progress' %}selected{% endif %}>In Progress</option>
                        <option value="Completed" {% if lab.status == 'Completed' %}selected{% endif %}>Completed</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="notes" class="form-label text-white fw-bold">Mission Notes / Payload Logs</label>
                    <textarea class="form-control bg-dark text-white border-secondary" id="notes" name="notes" rows="6">{{ lab.notes }}</textarea>
                </div>

                <div class="mb-4">
                    <label for="lab_file" class="form-label text-white fw-bold">
                        {% if lab.file_path %}Update Attachment{% else %}Attach Proof / Lab Files (Late Upload){% endif %}
                    </label>
                    <input class="form-control bg-dark text-white border-secondary" type="file" id="lab_file" name="lab_file">
                    {% if lab.file_path %}
                        <small class="text-info">Current file linked: {{ lab.file_path.split('_', 1)[1] }}</small>
                    {% else %}
                        <small class="text-muted">No file currently attached. Add one now to secure your progress.</small>
                    {% endif %}
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-warning fw-bold px-4 text-dark">Save Modifications</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
