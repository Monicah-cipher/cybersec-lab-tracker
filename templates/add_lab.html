{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4 shadow-sm">
            <h4 class="text-neon mb-4">📝 Log New CyberSec Operation</h4>
            
            <form action="{{ url_for('add_lab') }}" method="POST" enctype="multipart/form-data">
                
                <div class="mb-3">
                    <label for="title" class="form-label text-white fw-bold">Operation / Lab Name</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" id="title" name="title" placeholder="e.g., TryHackMe - Blue" required>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="platform" class="form-label text-white fw-bold">Platform</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" id="platform" name="platform" placeholder="e.g., TryHackMe, HTB, PortSwigger" required>
                    </div>
                    <div class="col-md-6">
                        <label for="category" class="form-label text-white fw-bold">Category</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" id="category" name="category" placeholder="e.g., Web, Windows PrivEsc, Network">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="status" class="form-label text-white fw-bold">Status</label>
                    <select class="form-select bg-dark text-white border-secondary" id="status" name="status">
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="notes" class="form-label text-white fw-bold">Mission Notes / Payload Logs</label>
                    <textarea class="form-control bg-dark text-white border-secondary" id="notes" name="notes" rows="6" placeholder="Document your methodology, commands used, or findings here..."></textarea>
                </div>

                <div class="mb-4">
                    <label for="lab_file" class="form-label text-white fw-bold">Attach Proof / Lab Files (Optional)</label>
                    <input class="form-control bg-dark text-white border-secondary" type="file" id="lab_file" name="lab_file">
                    <small class="text-muted">Allowed: txt, pdf, png, jpg, jpeg, md</small>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-success fw-bold px-4">Deploy Log</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
